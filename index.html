<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Co se stalo v Táboře</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2305070c'/%3E%3Crect x='3' y='3' width='10' height='10' rx='1' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070c;--cyan:#22d3ee;--orange:#ff9a3c;--txt:#eef3ff;--muted:#8ea0b8;--head:"Bebas Neue",Impact,sans-serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 var(--sans)}
body{background:radial-gradient(700px 420px at 110% -5%,rgba(34,211,238,.16),transparent 60%),radial-gradient(600px 380px at -20% 40%,rgba(255,154,60,.08),transparent 60%),var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.wrap{max-width:480px;width:100%}
.kicker{font:700 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--orange);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:22px;height:2px;background:var(--orange)}
h1{font:400 56px/.9 var(--head);letter-spacing:.01em;text-transform:uppercase;margin-bottom:14px}
h1 span{color:var(--cyan);text-shadow:0 0 28px rgba(34,211,238,.45)}
.tag{color:#c9d4e6;margin-bottom:28px;font-size:15px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;border-radius:12px;padding:16px;font:700 16px var(--sans);margin-top:10px}
.btn.main{background:var(--orange);color:#1a0b00;box-shadow:0 8px 28px -8px rgba(255,154,60,.7)}
.btn.sec{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid rgba(94,225,255,.22)}
.note{color:var(--muted);font:500 11px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Tábor · městská mise</div>
  <h1>Co se stalo<br><span>v Táboře</span></h1>
  <p class="tag">Dluh k Rolandovi drží Žižku v tomhle století.<br>Splatíte účet — otevře se cesta domů. · ~90&nbsp;min · 9 stanic.</p>
  <a class="btn main" href="demo2/?v=r24">Hrát demo · plná trasa (9 stanic)</a>
  <a class="btn sec" href="play/">Starý experimentální build</a>
  <p class="note">Demo · r24 · P0 tón + fotky/čest</p>
</div>
</body>
</html>
