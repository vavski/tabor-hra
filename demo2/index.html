<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Co se stalo v Táboře · ukázka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2305070c'/%3E%3Crect x='3' y='3' width='10' height='10' rx='1' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=r7">
</head>
<body>
<div id="splash" class="splash">
  <div class="splash-bg" style="background-image:url(assets/img/splash-v1.jpg)" role="img" aria-label="Žižkovo náměstí, kašna, Tábor"></div>
  <div class="splash-in">
    <div class="kicker">Tábor · městská mise</div>
    <h1>Co se stalo<br><span>v Táboře</span></h1>
    <p class="tag">Probudil se u kašny. Účet za 38 piv.<br>Nic si nepamatuje.</p>
    <button class="btn cta" id="startBtn">Otevřít chat se Žižkou</button>
    <p class="demo-note">Ukázka · úvod + 2 stanice · zvrat zamčený</p>
  </div>
</div>

<div id="app" class="app hide">
  <header class="top">
    <div class="chat-head">
      <div class="av av-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40" fill="none">
          <circle cx="20" cy="20" r="19" fill="#0a121c" stroke="#22d3ee" stroke-width="1.5"/>
          <ellipse cx="20" cy="20" rx="6" ry="8" stroke="#5ee1ff" stroke-width="1.5"/>
          <circle cx="20" cy="20" r="2.5" fill="#22d3ee"/>
          <path d="M8 18h8M24 18h8" stroke="#ff9a3c" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="who"><b>Žižka</b><span id="status">online</span></div>
      <button class="menu" id="menuBtn" aria-label="Menu"><i></i><i></i><i></i></button>
    </div>
    <div class="nightbar">
      <div class="nb-head"><span>Okénka z noci</span><span class="nb-count"><b id="count">0</b>/9</span></div>
      <div class="windows" id="windows" aria-label="Okénka z noci"></div>
    </div>
  </header>
  <main id="feed" class="feed"></main>
</div>

<div id="modal" class="modal hide"><div class="modal-in"><img alt=""><p></p><button class="btn sec" id="modalClose">Zavřít</button></div></div>
<div id="menu" class="modal hide"><div class="modal-in"><h3>Menu</h3><button class="btn sec" id="resetBtn">Začít znovu</button><button class="btn" id="menuClose">Zpět do chatu</button></div></div>
<script src="app.js?v=r7"></script>
</body>
</html>
