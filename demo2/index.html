<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131a2e">
<title>Co se stalo v Táboře · ukázka</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23F2B53A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" class="splash">
  <img src="assets/img/zizka-avatar.svg" alt="" class="splash-av">
  <h1>Co se stalo<br>v Táboře</h1>
  <p class="tag">Žižka se probudil u kašny. Nepamatuje si nic.<br>Vy máte 90 minut, než bude nástup.</p>
  <button class="btn big" id="startBtn">Otevřít chat se Žižkou</button>
  <p class="demo-note">Ukázka: úvod + stanice 1–2</p>
</div>

<div id="app" class="app hide">
  <header class="top">
    <div class="chat-head">
      <img src="assets/img/zizka-avatar.svg" alt="" class="av">
      <div class="who"><b>Žižka</b><span id="status">online</span></div>
      <button class="menu" id="menuBtn" aria-label="Menu">⋯</button>
    </div>
    <div class="windows" id="windows" aria-label="Okénka z noci"></div>
  </header>
  <main id="feed" class="feed"></main>
</div>

<div id="modal" class="modal hide"><div class="modal-in"><img alt=""><p></p><button class="btn sec" id="modalClose">Zavřít</button></div></div>
<div id="menu" class="modal hide"><div class="modal-in"><h3>Menu</h3><button class="btn sec" id="resetBtn">Začít znovu</button><button class="btn" id="menuClose">Zpět do chatu</button></div></div>
<script src="app.js"></script>
</body>
</html>
