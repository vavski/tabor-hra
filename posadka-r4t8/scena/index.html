<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05090f">
<title>Posádka · paluba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Space+Grotesk:wght@500&display=swap">
<style>
/* Zkouška vizuálu první scény (14. 11. 2026). Noční moře, naše paluba, fregata za zády. */
:root{--fg:#efe6d2;--muted:#9aa7b6;--brass:#d4a94e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05090f;color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
#intro{position:fixed;inset:0;z-index:20;background:#05090f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity 1.6s}
#intro.gone{opacity:0;pointer-events:none}
.pub{font-family:"Space Grotesk",sans-serif;letter-spacing:.42em;font-size:13px;color:var(--muted);text-transform:uppercase}
.ttl{font-family:"Pirata One",serif;font-size:72px;line-height:1;color:var(--brass);margin:0}
.sub{color:var(--muted);margin:0;max-width:300px}
#seal{position:relative;width:132px;height:132px;border-radius:50%;border:0;background:radial-gradient(circle at 40% 35%,#9b1c1c,#5a0c0c 70%);box-shadow:0 0 0 6px #2a0606,0 10px 40px #000;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
#seal span{font-family:"Pirata One",serif;font-size:44px;color:#e8c9a0;opacity:.85}
#seal svg{position:absolute;inset:-14px;width:160px;height:160px;transform:rotate(-90deg);pointer-events:none}
#seal circle{fill:none;stroke:var(--brass);stroke-width:4;stroke-dasharray:440;stroke-dashoffset:440}
#load{font-size:13px;color:var(--muted);min-height:18px}
#flash{position:fixed;inset:0;z-index:19;background:#fff;opacity:0;pointer-events:none;transition:opacity .9s}
#voice{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 108px);z-index:10;text-align:center;padding:0 22px;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:24px;line-height:1.25;color:#f3ead6;text-shadow:0 2px 12px #000,0 0 3px #000;opacity:0;transition:opacity .8s;pointer-events:none}
#voice.on{opacity:1}
#ui{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px calc(env(safe-area-inset-bottom) + 22px);pointer-events:none}
.rb{pointer-events:auto;appearance:none;border:1px solid #ffffff33;background:#0b1320b3;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px;padding:12px 16px;display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.rb svg{width:22px;height:22px}
#scopeBtn.pulse{animation:pl 1.4s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 #d4a94e88}50%{box-shadow:0 0 0 10px #d4a94e00}}
.rb:focus-visible,#seal:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
#scope{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(circle at 50% 46%,transparent 0 39vmin,rgba(0,0,0,.55) 41vmin,#000 42.5vmin)}
#scope.on{opacity:1}
#hint{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:0;right:0;z-index:11;text-align:center;font-size:13px;color:var(--muted);text-shadow:0 1px 6px #000;opacity:0;transition:opacity .6s;pointer-events:none}
#hint.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="flash"></div>
<div id="scope"></div>
<div id="hint">Otáčej se s telefonem. Bez pohybu táhni prstem.</div>
<div id="voice" aria-live="polite"></div>
<div id="ui">
  <button class="rb" id="soundBtn" aria-pressed="true" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span>Zvuk</span></button>
  <button class="rb" id="scopeBtn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6.5" cy="15" r="4"/><circle cx="17.5" cy="15" r="4"/><path d="M9 11l1.5-6h3L15 11M10.5 15h3"/></svg><span>Dalekohled</span></button>
</div>
<div id="intro">
  <div class="pub">Cikáda uvádí</div>
  <h1 class="ttl">Posádka</h1>
  <p class="sub">Podepiš smlouvu. Drž prst na pečeti.</p>
  <button id="seal" aria-label="Podržet a podepsat smlouvu"><svg viewBox="0 0 160 160"><circle id="ring" cx="80" cy="80" r="70"/></svg><span>P</span></button>
  <div id="load">Nakládám loď…</div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {Water} from 'three/addons/objects/Water.js';

const $=s=>document.querySelector(s);
const vibe=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const D2R=Math.PI/180;
const WORD='STUJ';                       // vzkaz fregaty (v kostře se losuje z kódu posádky)
const SKY_ROT=84*D2R, MOON_AZ=120*D2R, MOON_EL=18*D2R, FRIG_AZ=205*D2R, FRIG_DIST=235;
const FOG=0x223149, DECK=2.0;

/* ---------- renderer, scéna, kamera ---------- */
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
let PR=Math.min(devicePixelRatio||1,1.75);
renderer.setPixelRatio(PR);renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(FOG,0.0021);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,8000);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

const manager=new THREE.LoadingManager();
let loaded=false;
manager.onProgress=(u,a,b)=>{$('#load').textContent=`Nakládám loď… ${Math.round(a/b*100)} %`};
manager.onLoad=()=>{loaded=true;$('#load').textContent='Připraveno.'};
const TL=new THREE.TextureLoader(manager);
function tex(url,rep=[1,1],srgb=false){const t=TL.load(url);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);t.anisotropy=maxAniso;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t}
function pbr(name,rep,extra={}){return new THREE.MeshStandardMaterial({map:tex(name+'_diff.jpg',rep,true),normalMap:tex(name+'_nor.jpg',rep),roughnessMap:tex(name+'_rough.jpg',rep),...extra})}

/* ---------- obloha: fotka noční oblohy, u obzoru mlha ---------- */
const moonDir=new THREE.Vector3(Math.sin(MOON_AZ)*Math.cos(MOON_EL),Math.sin(MOON_EL),-Math.cos(MOON_AZ)*Math.cos(MOON_EL));
const skyTex=TL.load('sky.jpg');skyTex.colorSpace=THREE.SRGBColorSpace;
const sky=new THREE.Mesh(new THREE.SphereGeometry(5000,48,24),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{map:{value:skyTex},rot:{value:SKY_ROT},haze:{value:new THREE.Color(FOG)}},
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);gl_Position.z=gl_Position.w;}`,
  fragmentShader:`uniform sampler2D map;uniform float rot;uniform vec3 haze;varying vec3 vDir;
    void main(){vec3 d=normalize(vDir);float e=asin(clamp(d.y,-1.,1.));float az=atan(d.x,-d.z);
      float u=fract((az-rot)/6.2831853+.5);float v=.065+clamp(e/1.5707963,0.,1.)*.935;   // spodek fotky (stromy) se nikdy nepoužije
      vec3 c=texture2D(map,vec2(u,v)).rgb;
      c*=vec3(.62,.70,.88);                         // studenější a tmavší noc
      c=mix(haze,c,smoothstep(.0,.16,e));           // mořský opar schová obzor z fotky
      gl_FragColor=vec4(c,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
}));
sky.renderOrder=-1;scene.add(sky);

/* ---------- moře (three.js Water, MIT) ---------- */
const waterNormals=TL.load('waternormals.jpg',t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping});
const water=new Water(new THREE.PlaneGeometry(12000,12000),{
  textureWidth:512,textureHeight:512,waterNormals,sunDirection:moonDir.clone(),
  sunColor:0xc9d6ff,waterColor:0x03101c,distortionScale:3.2,fog:true,alpha:1
});
water.rotation.x=-Math.PI/2;water.material.uniforms.size.value=2.2;scene.add(water);

/* ---------- světla ---------- */
scene.add(new THREE.HemisphereLight(0x6b84b8,0x0a0e16,0.55));
const moonLight=new THREE.DirectionalLight(0xbfd0ff,1.25);moonLight.position.copy(moonDir).multiplyScalar(200);scene.add(moonLight);

/* ---------- pomocné textury kreslené kódem ---------- */
function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=maxAniso;return t}
function rnd(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sailTex=(tone)=>canvasTex(512,512,(x,w,h)=>{
  const r=rnd(3);x.fillStyle=tone;x.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){x.fillStyle=`rgba(${r()<.5?0:255},${r()<.5?20:240},0,${r()*.035})`;x.fillRect(r()*w,r()*h,2+r()*6,2+r()*6)}
  x.strokeStyle='rgba(60,45,25,.28)';x.lineWidth=2;for(let px=0;px<w;px+=34){x.beginPath();x.moveTo(px,0);x.lineTo(px+r()*3,h);x.stroke()}
  let g=x.createLinearGradient(0,h*.55,0,h);g.addColorStop(0,'rgba(40,30,15,0)');g.addColorStop(1,'rgba(40,30,15,.35)');x.fillStyle=g;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(50,38,20,.5)';x.lineWidth=6;x.strokeRect(3,3,w-6,h-6);
});
const glowTex=canvasTex(128,128,(x,w,h)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,214,150,1)');g.addColorStop(.25,'rgba(255,170,80,.55)');g.addColorStop(1,'rgba(255,140,40,0)');x.fillStyle=g;x.fillRect(0,0,w,h)});
function glow(size,op=1){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:op,fog:false}));s.scale.set(size,size,1);return s}

/* signální vlajky (mezinárodní abeceda, kreslené kódem) */
const FC={r:'#c8261b',w:'#efeee6',b:'#1d43a0',y:'#ecc11a',k:'#151515'};
function drawFlag(c,L,w,h){
  const R=(col,a,b,cw,ch)=>{c.fillStyle=col;c.fillRect(a,b,cw,ch)};
  const P=(col,p)=>{c.fillStyle=col;c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill()};
  switch(L){
    case 'S':R(FC.w,0,0,w,h);R(FC.b,w/3,h/3,w/3,h/3);break;
    case 'T':R(FC.r,0,0,w/3,h);R(FC.w,w/3,0,w/3,h);R(FC.b,2*w/3,0,w/3+1,h);break;
    case 'U':R(FC.w,0,0,w,h);R(FC.r,0,0,w/2,h/2);R(FC.r,w/2,h/2,w/2,h/2);break;
    case 'J':R(FC.b,0,0,w,h);R(FC.w,0,h/3,w,h/3);break;
    case 'O':R(FC.y,0,0,w,h);P(FC.r,[0,0,w,0,w,h]);break;
    case 'P':R(FC.b,0,0,w,h);R(FC.w,w/3,h/3,w/3,h/3);break;
    default:R(FC.y,0,0,w,h);
  }
}
const flagTex=L=>canvasTex(256,180,(x,w,h)=>{drawFlag(x,L,w,h);const r=rnd(L.charCodeAt(0));for(let i=0;i<1400;i++){x.fillStyle=`rgba(0,0,0,${r()*.06})`;x.fillRect(r()*w,r()*h,3,3)}});
const jollyTex=canvasTex(256,170,(x,w,h)=>{x.fillStyle='#0d0d0f';x.fillRect(0,0,w,h);x.fillStyle='#e9e4d6';
  x.beginPath();x.arc(w/2,h*.42,30,0,7);x.fill();x.fillRect(w/2-18,h*.5,36,22);x.fillStyle='#0d0d0f';x.beginPath();x.arc(w/2-11,h*.4,8,0,7);x.arc(w/2+11,h*.4,8,0,7);x.fill();
  x.strokeStyle='#e9e4d6';x.lineWidth=11;x.lineCap='round';x.beginPath();x.moveTo(w/2-58,h*.66);x.lineTo(w/2+58,h*.92);x.moveTo(w/2+58,h*.66);x.lineTo(w/2-58,h*.92);x.stroke()});

/* vlající látka: rovina, která se hýbe ve větru */
const flutter=[];
function cloth(w,h,map,amp=.18,basic=false){
  const g=new THREE.PlaneGeometry(w,h,10,6);g.translate(w/2,0,0);
  const m=basic?new THREE.MeshBasicMaterial({map,side:THREE.DoubleSide,color:0xbfbfbf}):new THREE.MeshStandardMaterial({map,side:THREE.DoubleSide,roughness:1});
  const mesh=new THREE.Mesh(g,m);flutter.push({g,base:g.attributes.position.array.slice(),w,amp,ph:Math.random()*6});return mesh;
}
function updateFlutter(t){for(const f of flutter){const p=f.g.attributes.position.array,b=f.base;for(let i=0;i<p.length;i+=3){const k=b[i]/f.w;p[i+2]=b[i+2]+Math.sin(t*5.5+b[i]*2.2+f.ph)*f.amp*k*f.w*.25+Math.sin(t*3.1+b[i+1]*1.7)*.04*k}f.g.attributes.position.needsUpdate=true;f.g.computeVertexNormals()}}

/* plachta vydutá větrem (vítr fouká zezadu, plachta se vyboulí dopředu = -Z) */
function sail(w,h,map,belly=1.2,mat){
  const g=new THREE.PlaneGeometry(w,h,14,10);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i)/(w/2),y=p.getY(i)/(h/2);p.setZ(i,-belly*(1-x*x)*(0.75+0.25*(1-y)) );p.setX(i,p.getX(i)*(1-0.06*(1-y)))}
  g.computeVertexNormals();return new THREE.Mesh(g,mat||new THREE.MeshStandardMaterial({map,side:THREE.DoubleSide,roughness:1}));
}
/* lano jako tenký válec mezi dvěma body */
const ropeMat=new THREE.MeshStandardMaterial({color:0x2b2014,roughness:1});
function rope(a,b,r=.025,mat=ropeMat){const d=new THREE.Vector3().subVectors(b,a),L=d.length();const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,5,1,true),mat);m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return m}

/* ---------- NAŠE LOĎ ---------- */
const ship=new THREE.Group();scene.add(ship);
const rig=new THREE.Group();rig.position.set(-1.0,DECK+1.62,3.1);ship.add(rig);rig.add(camera);
const deckMat=pbr('wood_floor_deck',[1,1],{roughness:1,color:0x9a8f80});
deckMat.map.rotation=Math.PI/2;deckMat.normalMap.rotation=Math.PI/2;deckMat.roughnessMap.rotation=Math.PI/2;
const plankMat=pbr('weathered_planks',[1,1],{side:THREE.DoubleSide,color:0x9a8b78});
const darkPlank=pbr('weathered_planks',[1,1],{side:THREE.DoubleSide,color:0x4a3a2c});
const metalMat=pbr('rusty_metal_02',[1,1],{metalness:.85,color:0x55504a});
const woodRough=new THREE.MeshStandardMaterial({color:0x3a2616,roughness:.9});
// obrys paluby: záď vzadu (+Z), příď vpředu (-Z) do špičky
const halfW=z=>z>=-2?2.75-0.45*Math.pow((z+2)/9,2):2.75*Math.pow(Math.max(0,Math.cos((-2-z)/8.6*Math.PI/2)),0.75);
const Z0=7,Z1=-10.6,outline=[];
for(let z=Z0;z>=Z1;z-=0.4)outline.push([halfW(z),z]);
const right=outline.slice(),left=outline.slice().reverse().map(([x,z])=>[-x,z]);
const ring=[...right,...left];               // uzavřený obrys (pravobok dopředu, levobok dozadu)
{ // paluba
  const sh=new THREE.Shape();ring.forEach(([x,z],i)=>i?sh.lineTo(x,-z):sh.moveTo(x,-z));
  const g=new THREE.ShapeGeometry(sh);g.rotateX(-Math.PI/2);
  const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)/2.4,uv.getY(i)/2.4);
  const m=new THREE.Mesh(g,deckMat);m.position.y=DECK;ship.add(m);
}
function ribbon(pts,y0,y1,mat,inset=0,uvScale=2){ // svislý pás podél obrysu
  const pos=[],uv=[],idx=[];let acc=0;
  pts.forEach(([x,z],i)=>{if(i)acc+=Math.hypot(x-pts[i-1][0],z-pts[i-1][1]);const s=1-inset;pos.push(x,y0,z, x*s,y1,z);uv.push(acc/uvScale,0, acc/uvScale,(y1-y0)/uvScale)});
  for(let i=0;i<pts.length-1;i++){const a=i*2;idx.push(a,a+2,a+1, a+1,a+2,a+3)}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  return new THREE.Mesh(g,mat);
}
const closed=[...ring,ring[0]];
ship.add(ribbon(closed,DECK,DECK+1.05,plankMat));                 // hrazení
ship.add(ribbon(closed.map(([x,z])=>[x*1.04,z]),-0.3,DECK+1.05,darkPlank,0.06,2.5)); // bok lodi
{ // horní lišta hrazení
  const pts=closed.map(([x,z])=>new THREE.Vector3(x,DECK+1.07,z));
  const curve=new THREE.CatmullRomCurve3(pts,true);ship.add(new THREE.Mesh(new THREE.TubeGeometry(curve,260,.07,6,true),woodRough));
  for(let i=0;i<closed.length-1;i+=3){const [x,z]=closed[i];const s=new THREE.Mesh(new THREE.BoxGeometry(.12,1.05,.12),woodRough);s.position.set(x*.97,DECK+.52,z);ship.add(s)}
}
// stěžeň, ráhna, plachty
const MZ=-1.6,MH=21;
const mast=new THREE.Mesh(new THREE.CylinderGeometry(.13,.24,MH,14),plankMat);mast.position.set(0,DECK+MH/2,MZ);ship.add(mast);
const ourSail=sailTex('#d8ccae');
[[11.5,10.5,7.2],[17.4,7.6,5.2]].forEach(([y,w,h])=>{
  const yard=new THREE.Mesh(new THREE.CylinderGeometry(.08,.11,w+1.4,8),woodRough);yard.rotation.z=Math.PI/2;yard.position.set(0,DECK+y,MZ+.25);ship.add(yard);
  const s=sail(w,h,ourSail,1.3);s.position.set(0,DECK+y-h/2-.15,MZ-.15);ship.add(s);
});
{ // vlajka na špičce stěžně
  const f=cloth(2.4,1.6,jollyTex,.25);f.position.set(0,DECK+MH-.9,MZ);f.rotation.y=Math.PI/2;ship.add(f);
}
// lanoví
const mt=new THREE.Vector3(0,DECK+MH-.6,MZ),mm=new THREE.Vector3(0,DECK+12.6,MZ);
for(const sd of [1,-1])for(let k=0;k<4;k++){const z=MZ+0.6-k*0.6;const a=new THREE.Vector3(sd*halfW(z)*.98,DECK+1.05,z);ship.add(rope(mm,a,.022));
  if(k<3)for(let j=1;j<9;j++){const t=j/9;const p1=new THREE.Vector3().lerpVectors(a,mm,t);const z2=MZ+0.6-(k+1)*0.6;const a2=new THREE.Vector3(sd*halfW(z2)*.98,DECK+1.05,z2);const p2=new THREE.Vector3().lerpVectors(a2,mm,t);ship.add(rope(p1,p2,.012))}}
const bowTip=new THREE.Vector3(0,DECK+2.6,Z1-4.2);
ship.add(rope(new THREE.Vector3(0,DECK+.9,Z1+.4),bowTip,.11,woodRough));       // čelen
ship.add(rope(mt,bowTip,.03));ship.add(rope(mt,new THREE.Vector3(0,DECK+1.1,Z0-.2),.03));
// kormidlo
{const g=new THREE.Group();const wheelR=.62;g.add(new THREE.Mesh(new THREE.TorusGeometry(wheelR,.035,8,32),woodRough));

    if(!sawFrig&&dot>Math.cos(22*D2R)){sawFrig=true;say('Královská fregata. A něco vám vzkazuje.',4600);setTimeout(()=>$('#scopeBtn').classList.add('pulse'),1500)}
    if(zoom&&!readFlags&&dot>Math.cos(4*D2R)){readFlags=true;say('Vlajky. Snad někdo z vás umí číst.',4600)}}
  renderer.render(scene,camera);
  // když se telefon nestíhá, zmenšíme rozlišení
  fpsN++;fpsT+=dt;if(fpsT>2.5){const fps=fpsN/fpsT;fpsN=0;fpsT=0;if(fps<38&&degraded<2&&started){degraded++;PR=Math.max(1,PR-.5);if(degraded===2)PR=.85;renderer.setPixelRatio(PR)}}
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
frame();
window.__scene={scene,camera,frig,ship,say,get sensor(){return sensor},set yaw(v){yawDrag=v},set pitch(v){pitch=v},zoomTo(v){zoom=v;fovT=v?9:70;$('#scope').classList.toggle('on',v)},signed};
